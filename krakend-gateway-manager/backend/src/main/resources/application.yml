server:
  # Backend gio la CA control plane (/api/**) LAN data plane (traffic that qua
  # DynamicDispatcherController) tren CUNG 1 port - khong con container KrakenD
  # rieng nua. Giu 8080 (tung la port KrakenD) de app goi vao khong doi URL.
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: krakend-gateway-manager
  datasource:
    # Dung CHUNG 1 Oracle instance + CHUNG schema voi cac service BCCS (khong con
    # Postgres rieng nua) - theo dung lua chon cua nguoi dung. Bang cua Gateway
    # Manager (endpoint_config, upstream_service...) nam CHUNG schema BCCS_PRODUCT,
    # da xac nhan khong trung ten voi bat ky bang nghiep vu that nao (xem
    # db-local/init/01_schema.sql) truoc khi chon huong nay.
    url: jdbc:oracle:thin:@//${DB_HOST:host.docker.internal}:${DB_PORT:1521}/${DB_NAME:FREEPDB1}
    username: ${DB_USER:BCCS_PRODUCT}
    password: ${DB_PASSWORD:BCCS_PRODUCT123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
  jpa:
    # Khong can khai database-platform ro rang - Hibernate 6 tu nhan dien OracleDialect
    # tu chinh driver JDBC (khai them se bi WARN deprecation).
    hibernate:
      # validate (KHONG con update, KHONG dung Flyway/tu dong tao schema nua) -
      # schema duoc TAO SAN qua ban giao DDL cho DBA tung doi tu chay tay (xem
      # db/team-schema/V1__baseline.sql + DEPLOYMENT_GUIDE.md) - ung dung CHI doi
      # chieu entity <-> schema that luc khoi dong, bao loi ro rang neu lech,
      # KHONG bao gio tu sua/tu tao gi ca. Doi tu update vi (1) ddl-auto=update
      # chua tung duoc xac nhan dung tren Oracle 19c that (chi test tren 23c) va
      # co loi da biet: khong tu noi CHECK constraint khi them enum moi vao bang
      # da co (tung dinh ORA-02290 that); (2) Oracle 19c cua tung doi BCCS thuong
      # la ha tang CU do DBA quan tri - user chay ung dung THUONG CHI duoc cap
      # quyen DML, KHONG co quyen DDL, nen ung dung KHONG THE tu tao bang du co
      # muon (da tung thu Flyway tu dong migrate luc khoi dong - bo lai vi khong
      # phu hop thuc te nay).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        # Tranh N+1 query khi EndpointMapper/DependencyAnalyzer duyet cac quan he LAZY
        # (steps, mappings, BackendStep.upstreamService, cac @ElementCollection) - Hibernate
        # tu gop nhieu lan lazy-load thanh 1 query "IN (...)" theo batch thay vi tung
        # query rieng le. Dung batch-size (khong phai @EntityGraph/JOIN FETCH) vi steps
        # va mappings deu la @OneToMany tren cung EndpointConfig - JOIN FETCH ca 2 trong
        # 1 query se dinh MultipleBagFetchException cua Hibernate.
        default_batch_fetch_size: 50
        # Buoc BAT BUOC de ddl-auto=validate pass: Hibernate 7 + Oracle 23c+ tu nhan dien
        # dialect ho tro BOOLEAN native, nen MAC DINH mong doi MOI field Java `boolean`
        # anh xa toi cot kieu BOOLEAN - trong khi TOAN BO schema hien tai (V1__baseline.sql
        # + DB dev that) dung NUMBER(1,0)+CHECK (quy uoc truoc 23c, giu de tuong thich
        # Oracle 19c) - khong ep property nay thi validate bao loi tren HAU HET cot boolean
        # (da xac nhan that qua loi "wrong column type... expecting [boolean]" tren
        # backend_step.forward_original_body luc thu that). PHAI nam duoi
        # spring.jpa.properties.hibernate.* (raw Hibernate property, spring.jpa.hibernate.*
        # chi nhan 1 tap con co dinh Spring Boot biet, dat sai cho se bi lang le bo qua).
        #
        # Dung INTEGER (KHONG phai NUMERIC) - da thu ca 2 gia tri that:
        #   - NUMERIC: validate PASS (chap nhan NUMBER(1,0)) nhung GHI DU LIEU LOI that
        #     ("Could not convert java.lang.Boolean to java.math.BigDecimal ... BooleanJavaType
        #     to unwrap") - la bug/gioi han that cua to hop Hibernate 7.2.24 + OracleDialect,
        #     khong phai loi cau hinh.
        #   - INTEGER: da xac nhan CA validate LAN ghi/doc that deu dung (test tren 1 Oracle
        #     23c-free HOAN TOAN trong/moi, DataSeeder ghi thanh cong 1 step cacheEnabled=true,
        #     API tra ve dung gia tri qua lai).
        type:
          preferred_boolean_jdbc_type: INTEGER
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents

# Cau hinh rieng cua Gateway Manager
gatewaymanager:
  gateway:
    # Phai khop dung ten service/container that trong docker-compose.yml (service
    # "backend", container_name "gwm-backend") - sai ten se khien DependencyAnalyzer.
    # isSelfHost() khong nhan dien duoc Upstream tu tro vao chinh gateway, bo sot
    # canh bao vong lap phu thuoc that.
    self-host-aliases: localhost,127.0.0.1,backend,gwm-backend
  # API key bao ve Control Plane (/api/**) - xem ApiKeyAuthFilter. Gia tri mac dinh
  # chi dung cho dev cuc bo; MOI truong that PHAI set qua env var GATEWAY_ADMIN_API_KEY
  # (xem docker-compose.yml), khong duoc dung gia tri mac dinh nay.
  admin-api-key: ${GATEWAY_ADMIN_API_KEY:changeme-local-dev}
  # Rate limit Data Plane (bao ve Upstream that phia sau) - xem RateLimitFilter/
  # RateLimitService. max-requests la so request toi da MOI client (theo IP) duoc
  # phep trong window-seconds giay; vuot qua se bi tu choi 429 cho toi khi window
  # het han. 300 req/60s (~5 req/s trung binh) la muc mac dinh vua du rong cho
  # test tay/tich hop binh thuong nhung van chan duoc spam/vong lap that su.
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    window-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}
    max-requests: ${GATEWAY_RATE_LIMIT_MAX_REQUESTS:300}
  # Audit log (request/hop) day vao Elasticsearch dung chung cua he thong BCCS
  # (xem db-local/docker-compose.yml - bccs-elasticsearch) - phuc vu trang
  # "Tra cuu Log". host/port ket noi qua host.docker.internal (dung y het cach
  # Oracle da lam) vi khong join chung network voi db-local.
  audit:
    enabled: ${GATEWAY_AUDIT_ENABLED:true}
    elasticsearch:
      host: ${GATEWAY_AUDIT_ES_HOST:localhost}
      port: ${GATEWAY_AUDIT_ES_PORT:9200}
    # So ngay giu lai log (gwm-requests-*/gwm-hops-*) - qua han se bi XOA CA
    # INDEX tu dong (xem AuditLogRetentionService), khong phai xoa tung
    # document. Dat <=0 de tat han (giu vinh vien, tu quan ly bang tay).
    retention-days: ${GATEWAY_AUDIT_RETENTION_DAYS:3}

# Resilience4j: dependency moi, dang ky dong theo TEN Upstream Service tai
# runtime (xem UpstreamHttpExecutor) - cac gia tri default duoi day ap dung
# khi mot Upstream chua co entry rieng.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 500ms
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms

logging:
  level:
    com.bccs.gatewaymanager: INFO
    org.hibernate.SQL: WARN
