# ============================================================================
# Service NodePort cho traffic that vao Data Plane - App/Client cua doi goi
# vao endpoint composite qua "<IP node>:<nodePort>" (thay the Ingress NGINX
# vi cum myviettel khong xac minh duoc Ingress Controller, cac service nha
# deu dung NodePort).
#
# TRIEN KHAI THAT 2026-09-10 (cum myviettel): nodePort 8052 - con trong
# (8050/8051 da bi chiem boi payment-service/gateway-manager-backend 1.1.0
# cu, 8837 la UI gateway cu). Node IP: 10.207.252.17 (worker-10207252017).
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: gwm-backend-nodeport
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: data-plane
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: data-plane
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 8052
    # TLS chang client -> gateway (cert self-signed SAN 10.207.252.17, Secret
    # gwm-tls). App/Client can tin cay thi import tls.crt vao truststore.
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 8053
