# Kich hoat qua SPRING_PROFILES_ACTIVE=control-plane - 1 instance DUY NHAT
# dung chung cho MOI doi (UI + CRUD Endpoint/Upstream/Team, xem
# SAD-Gateway-Manager.md ADR-07). Merge THEM vao application.yml (khong ghi
# de - 2 file cong lai).
spring:
  datasource:
    # Oracle TRUNG TAM dung chung cho MOI doi (khac han truoc 2026-09, khi moi
    # doi 1 DB rieng hoan toan) - bang Gateway Manager (endpoint_config,
    # upstream_service, gwm_team...) cach ly du lieu giua cac doi qua cot
    # team_code (xem V2__team_code.sql), KHONG phai qua schema/DB rieng nua.
    url: jdbc:oracle:thin:@//${DB_HOST:host.docker.internal}:${DB_PORT:1521}/${DB_NAME:FREEPDB1}
    username: ${DB_USER:BCCS_PRODUCT}
    password: ${DB_PASSWORD:BCCS_PRODUCT123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
  jpa:
    # Khong can khai database-platform ro rang - Hibernate 6 tu nhan dien OracleDialect
    # tu chinh driver JDBC (khai them se bi WARN deprecation).
    hibernate:
      # validate (KHONG con update, KHONG dung Flyway/tu dong tao schema nua) -
      # schema duoc TAO SAN qua ban giao DDL cho DBA tu chay tay (xem
      # db/team-schema/V1__baseline.sql + V2__team_code.sql + DEPLOYMENT_GUIDE.md) -
      # ung dung CHI doi chieu entity <-> schema that luc khoi dong, bao loi ro
      # rang neu lech, KHONG bao gio tu sua/tu tao gi ca.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        # Tranh N+1 query khi EndpointMapper/DependencyAnalyzer duyet cac quan he LAZY
        # (steps, mappings, BackendStep.upstreamService, cac @ElementCollection) - Hibernate
        # tu gop nhieu lan lazy-load thanh 1 query "IN (...)" theo batch thay vi tung
        # query rieng le. Dung batch-size (khong phai @EntityGraph/JOIN FETCH) vi steps
        # va mappings deu la @OneToMany tren cung EndpointConfig - JOIN FETCH ca 2 trong
        # 1 query se dinh MultipleBagFetchException cua Hibernate.
        default_batch_fetch_size: 50
        # Buoc BAT BUOC de ddl-auto=validate pass: Hibernate 7 + Oracle 23c+ tu nhan dien
        # dialect ho tro BOOLEAN native, nen MAC DINH mong doi MOI field Java `boolean`
        # anh xa toi cot kieu BOOLEAN - trong khi TOAN BO schema hien tai dung
        # NUMBER(1,0)+CHECK (quy uoc truoc 23c, giu de tuong thich Oracle 19c) - khong
        # ep property nay thi validate bao loi tren HAU HET cot boolean (da xac nhan
        # that qua loi "wrong column type... expecting [boolean]" tren
        # backend_step.forward_original_body luc thu that). PHAI nam duoi
        # spring.jpa.properties.hibernate.* (raw Hibernate property, spring.jpa.hibernate.*
        # chi nhan 1 tap con co dinh Spring Boot biet, dat sai cho se bi lang le bo qua).
        #
        # Dung INTEGER (KHONG phai NUMERIC) - da thu ca 2 gia tri that:
        #   - NUMERIC: validate PASS (chap nhan NUMBER(1,0)) nhung GHI DU LIEU LOI that
        #     ("Could not convert java.lang.Boolean to java.math.BigDecimal ... BooleanJavaType
        #     to unwrap") - la bug/gioi han that cua to hop Hibernate 7.2.24 + OracleDialect,
        #     khong phai loi cau hinh.
        #   - INTEGER: da xac nhan CA validate LAN ghi/doc that deu dung.
        type:
          preferred_boolean_jdbc_type: INTEGER

gatewaymanager:
  # platform-admin key - CHI dung cho "/api/teams/**" (man hinh Quan ly doi cua
  # doi nen tang) - xem ApiKeyAuthFilter. Moi doi con lai dung key RIENG cua
  # minh trong bang gwm_team, khong dung key nay. Gia tri mac dinh chi dung
  # cho dev cuc bo; moi truong that PHAI set qua GATEWAY_ADMIN_API_KEY.
  admin-api-key: ${GATEWAY_ADMIN_API_KEY:changeme-local-dev}
