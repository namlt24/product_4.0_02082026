# ============================================================================
# ConfigMap - toan bo bien moi truong KHONG bi mat (khong phai mat khau/khoa
# API) - doi chieu dung TEN bien voi backend/src/main/resources/application.yml
# va .env.example (dung CHUNG 1 bo ten voi ban Docker Compose, KHONG doi ten
# nao ca - Spring Boot doc y het qua bien moi truong container).
#
# MOI DOI: sua truc tiep cac gia tri duoi day cho dung ha tang cua minh truoc
# khi "kubectl apply -f 00-configmap.yaml -n <namespace-cua-doi>".
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gwm-config
  labels:
    app.kubernetes.io/name: gateway-manager
data:
  # Ma dinh danh doi - hien trong SPRING_APPLICATION_NAME/ELASTIC_APM_SERVICE_NAME.
  TEAM_CODE: "doi-cua-ban"

  # Oracle 19c+ CUA CHINH DOI - schema da duoc DBA tao san qua ban giao DDL
  # (xem DEPLOYMENT_GUIDE.md muc 2 + backend/src/main/resources/db/team-schema/).
  # DB_HOST co the la dia chi noi bo (vd oracle.doi-cua-ban.local) hoac 1
  # ExternalName Service tro toi Oracle ngoai cum k8s - KHONG chay Oracle
  # trong chinh cum nay (ngoai pham vi bo manifest nay).
  DB_HOST: "oracle.doi-cua-ban.local"
  DB_PORT: "1521"
  DB_NAME: "ten-pdb-hoac-service-cua-ban"

  # Redis - Service "gwm-redis" trong CUNG namespace (xem 30-redis.yaml), dung
  # DNS noi bo cua k8s, KHONG can sua neu dung dung ten Service trong bo nay.
  REDIS_HOST: "gwm-redis"
  REDIS_PORT: "6379"

  # Rate limit Data Plane - gia tri mac dinh hop ly cho da so truong hop.
  GATEWAY_RATE_LIMIT_ENABLED: "true"
  GATEWAY_RATE_LIMIT_WINDOW_SECONDS: "60"
  GATEWAY_RATE_LIMIT_MAX_REQUESTS: "300"

  # Audit log (Tra cuu Log) - tuy chon. Neu doi CHUA co Elasticsearch rieng,
  # dat GATEWAY_AUDIT_ENABLED="false" de tat han (khong anh huong traffic that).
  GATEWAY_AUDIT_ENABLED: "true"
  GATEWAY_AUDIT_ES_HOST: "elasticsearch.doi-cua-ban.local"
  ES_PORT: "9200"
  # So ngay giu lai log - qua han bi XOA CA INDEX tu dong moi 24h (xem
  # AuditLogRetentionService). Dat <=0 de tat han (giu vinh vien).
  GATEWAY_AUDIT_RETENTION_DAYS: "3"

  # Elastic APM - tuy chon, agent tu tat neu khong ket noi duoc.
  APM_SERVER_HOST: "apm.doi-cua-ban.local"
  APM_SERVER_PORT: "8200"
  APM_ENVIRONMENT: "production"
