springdoc:
  api-docs:
    enabled: ${BCCS_SPRINGDOC_ENABLED:true}
#    path: /v3/api-docs
  swagger-ui:
    enabled: ${BCCS_SPRINGDOC_UI_ENABLED:true}
#    path: /swagger-ui.html
  packages-to-scan: com.viettel.bccs.productcatalog
  paths-to-exclude: /actuator/**,/error
