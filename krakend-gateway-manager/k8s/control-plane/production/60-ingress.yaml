# ============================================================================
# 2 Service NodePort Control Plane - BẢN PRODUCTION
#
#   - gwm-frontend :80    -> NodePort 8837 (UI quản trị — browser của các đội)
#   - gwm-backend  :8080  -> NodePort 8051 (API: các Data Plane sync về + CRUD
#                            trực tiếp qua curl/script + team key)
#
# LƯU Ý QUAN TRỌNG VỀ IP TRUY CẬP: các Data Plane (cụm khác) gọi CP qua IP
# node + NodePort 8051. Quy ước hạ tầng: đội chỉ được dùng node
# worker-10029001014/.15 (IP 10.29.1.14/.15) — ghi IP chuẩn vào
# CONTROL_PLANE_BASE_URL của bộ Data Plane production.
#
# >>> SỬA TRƯỚC KHI APPLY: 2 nodePort phải là port CÒN TRỐNG trên toàn cụm
# (kiểm tra: kubectl get svc -A | grep <port>; range NodePort cụm = 8000-10000).
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: gwm-frontend-nodeport
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane-ui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 8837
---
apiVersion: v1
kind: Service
metadata:
  name: gwm-backend-nodeport
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 8051
