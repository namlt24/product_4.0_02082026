    password: BCCS_PRODUCT123
  data:
    redis:
      # --- Redis Enterprise Standalone Endpoint ---
      # host: ${REDIS_HOST:localhost}
      # port: ${REDIS_PORT:6379}
      # ----------------------------------------------------

      # --- Redis Enterprise Cluster Endpoint ------
      cluster:
        nodes:
          - 10.207.252.213:9001
          - 10.207.252.213:9002
          - 10.207.252.213:9003
          - 10.207.252.213:9004
          - 10.207.252.213:9005
          - 10.207.252.213:9006
          - 10.207.252.213:9007
          - 10.207.252.213:9008
          - 10.207.252.213:9009
        max-redirects: 3
      # ----------------------------------------------------

      # ACL Authentication
      username: ${REDIS_USERNAME:redis_miniapp}
