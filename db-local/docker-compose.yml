name: bccs-db-local

services:
  database:
    image: gvenzl/oracle-free:23-slim
    container_name: bccs-oracle
    environment:
      ORACLE_PASSWORD: ${DB_ROOT_PASSWORD:-bccs_root}
      APP_USER: ${DB_USERNAME:-BCCS_PRODUCT}
      APP_USER_PASSWORD: ${DB_PASSWORD:-BCCS_PRODUCT123}
    ports:
      - "${DB_PORT:-1521}:1521"
    volumes:
      - ./oradata:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: bccs-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - bccs_es_local_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  bccs_es_local_data:
