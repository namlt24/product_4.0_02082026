spring:
  application:
    name: ${APP_NAME:product-price-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:oracle:thin:@10.207.222.170:1521:DB170
    username: BCCS_PRODUCT
    password: BCCS_PRODUCT123
  data:
    redis:
      # --- Redis Enterprise Standalone Endpoint ---
      # host: ${REDIS_HOST:localhost}
      # port: ${REDIS_PORT:6379}
      # ----------------------------------------------------

      # --- Redis Enterprise Cluster Endpoint ------
      cluster:
        nodes:
          - 10.207.252.213:9001
          - 10.207.252.213:9002
          - 10.207.252.213:9003
          - 10.207.252.213:9004
          - 10.207.252.213:9005
          - 10.207.252.213:9006
          - 10.207.252.213:9007
          - 10.207.252.213:9008
          - 10.207.252.213:9009
        max-redirects: 3
      # ----------------------------------------------------

      # ACL Authentication
      username: ${REDIS_USERNAME:redis_miniapp}
      password: ${REDIS_PASSWORD:redisMiniApp@2025}
      # TLS Configuration
      # ssl:
      #   enabled: true

      timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 3000ms
        shutdown-timeout: 100ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.207.252.169:8859}
    consumer:
      group-id: ${BCCS_KAFKA_CONSUMER_GROUP_ID:${spring.application.name}}

server:
  port: ${APP_PORT:8005}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:never}
  info:
    env:
      enabled: true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.viettel.bccs: ${BCCS_LOG_LEVEL:${LOG_LEVEL:INFO}}

bccs:
  web:
    enabled: ${BCCS_WEB_ENABLED:true}
    include-stacktrace: ${BCCS_WEB_INCLUDE_STACKTRACE:false}
    request-context:
      enabled: ${BCCS_WEB_REQUEST_CONTEXT_ENABLED:true}
    exception-handler:
      enabled: ${BCCS_WEB_EXCEPTION_HANDLER_ENABLED:true}
    response:
      include-trace-id: ${BCCS_WEB_RESPONSE_INCLUDE_TRACE_ID:true}

  config:
    enabled: true
    team-code: PRICE
    service-name: product-price-service
    client:
      base-url: http://bccs-config-service:8080
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
    kafka:
      enabled: true
      topic: bccs.config-events.v1
      consumer-group-mode: instance
    sync:
      enabled: true
      interval-seconds: 300
      retry:
        max-attempts: 3
        backoff-ms: 1000
    response-code:
      enabled: true
      startup:
        load-latest: true
        fail-fast: false
      missing-code:
        response-mode: code-as-message
        trigger-refresh: true
        log-level: WARN

  response:
    defaults:
      success-code: SUCCESS
      system-error-code: BCCS-SYS-TECH-0001
      validation-error-code: BCCS-SYS-VAL-0001
      unauthorized-error-code: BCCS-AUTH-SEC-0001
      forbidden-error-code: BCCS-AUTH-SEC-0002
      integration-error-code: BCCS-SYS-INT-0001
      rate-limit-error-code: BCCS-SYS-RATE-0001

  message:
    formatter: message-format
    missing-arg-mode: keep-template
    format-failed-mode: keep-template
  logging:
    enabled: ${BCCS_LOGGING_ENABLED:true}
    mdc:
      enabled: ${BCCS_LOGGING_MDC_ENABLED:true}
    masking:
      enabled: ${BCCS_LOGGING_MASKING_ENABLED:true}
    request:
      enabled: ${BCCS_LOGGING_REQUEST_ENABLED:true}
      log-headers: ${BCCS_LOGGING_REQUEST_LOG_HEADERS:false}
      log-body: ${BCCS_LOGGING_REQUEST_LOG_BODY:false}

  observability:
    enabled: ${BCCS_OBSERVABILITY_ENABLED:true}
    service-name: ${spring.application.name}
    service-version: ${APP_VERSION:local}
    environment: ${APP_ENV:${SPRING_PROFILES_ACTIVE:local}}
    metrics:
      enabled: ${BCCS_OBSERVABILITY_METRICS_ENABLED:true}
    tracing:
      enabled: ${BCCS_OBSERVABILITY_TRACING_ENABLED:true}
    actuator:
      enabled: ${BCCS_OBSERVABILITY_ACTUATOR_ENABLED:true}

  security:
    enabled: ${BCCS_SECURITY_ENABLED:true}
    jwt:
      enabled: ${BCCS_SECURITY_JWT_ENABLED:true}
    public-paths:
      - /actuator/health
      - /actuator/info
      - /v3/api-docs
      - /v3/api-docs/**
      - /v3/api-docs.yaml
      - /swagger-ui.html
      - /swagger-ui/**
      - /error

  cache:
    enabled: ${BCCS_CACHE_ENABLED:true}
    mode: ${BCCS_CACHE_MODE:memory-only}
    key-prefix: ${BCCS_CACHE_KEY_PREFIX:${spring.application.name}}
    version: ${BCCS_CACHE_VERSION:v1}
    l1:
      provider: caffeine
      default-ttl: ${BCCS_CACHE_L1_TTL:10m}
      max-size: ${BCCS_CACHE_L1_MAX_SIZE:10000}
    l2:
      provider: redis
      default-ttl: ${BCCS_CACHE_L2_TTL:1h}
      key-serializer: string
      value-serializer: json
      cache-null-values: false
    invalidation:
      enabled: ${BCCS_CACHE_INVALIDATION_ENABLED:false}
      provider: redis
      topic: ${BCCS_CACHE_INVALIDATION_TOPIC:bccs.cache.invalidation}

  kafka:
    enabled: ${BCCS_KAFKA_ENABLED:true}
    default-topic-prefix: ${BCCS_KAFKA_TOPIC_PREFIX:${spring.application.name}}
    producer:
      enabled: ${BCCS_KAFKA_PRODUCER_ENABLED:true}
    consumer:
      enabled: ${BCCS_KAFKA_CONSUMER_ENABLED:true}
      group-id: ${BCCS_KAFKA_CONSUMER_GROUP_ID:${spring.application.name}}
    dlq:
      enabled: ${BCCS_KAFKA_DLQ_ENABLED:true}
    retry:
      enabled: ${BCCS_KAFKA_RETRY_ENABLED:true}
      max-attempts: ${BCCS_KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${BCCS_KAFKA_RETRY_BACKOFF_MS:1000}
    tracing:
      enabled: ${BCCS_KAFKA_TRACING_ENABLED:true}

  data:
    enabled: ${BCCS_DATA_ENABLED:true}
    database-type: ${BCCS_DATA_DATABASE_TYPE:ORACLE}
    audit:
      enabled: ${BCCS_DATA_AUDIT_ENABLED:true}
    migration:
      enabled: ${BCCS_DATA_MIGRATION_ENABLED:true}
    transaction:
      enabled: ${BCCS_DATA_TRANSACTION_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${BCCS_SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${BCCS_SPRINGDOC_UI_ENABLED:false}
    path: /swagger-ui.html
  packages-to-scan: com.viettel.bccs.price
  paths-to-exclude: /actuator/**,/error

