    password: Viettel#2025
  data:
    redis:
      # --- Redis Enterprise Standalone Endpoint ---
      # host: ${REDIS_HOST:localhost}
      # port: ${REDIS_PORT:6379}
      # ----------------------------------------------------

      # --- Redis Enterprise Cluster Endpoint ------
      cluster:
        nodes:
          - 10.207.252.213:9001
          - 10.207.252.213:9002
          - 10.207.252.213:9003
          - 10.207.252.213:9004
          - 10.207.252.213:9005
          - 10.207.252.213:9006
          - 10.207.252.213:9007
          - 10.207.252.213:9008
          - 10.207.252.213:9009
      # ----------------------------------------------------

      # ACL Authentication
      username: ${REDIS_USERNAME:redis_miniapp}
      password: ${REDIS_PASSWORD:redisMiniApp@2025}
      # TLS Configuration
      # ssl:
      #   enabled: true

      timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 3000ms
        shutdown-timeout: 100ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.207.252.169:8859}
    consumer:
      group-id: ${BCCS_KAFKA_CONSUMER_GROUP_ID:${spring.application.name}}

server:
  port: ${APP_PORT:8005}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      show-details: always

bccs:
  web:
    include-stacktrace: true
  config:
    enabled: true
    team-code: CATALOG
    service-name: product-price-service
    client:
      base-url: ${BCCS_CONFIG_SERVICE_BASE_URL:http://10.207.252.17:8484}
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
    kafka:
      enabled: true
      topic: bccs.config-events.v1
      consumer-group-mode: instance
    sync:
      enabled: true
      interval-seconds: 300
      retry:
        max-attempts: 3
        backoff-ms: 1000
    response-code:
      enabled: true
      startup:
        load-latest: true
        fail-fast: false
      missing-code:
        response-mode: code-as-message
        trigger-refresh: true
        log-level: WARN

    option-set:
      enabled: true
      sync-interval: 60s
      fail-fast: false
      kafka-enabled: true
  response:
    defaults:
      success-code: SUCCESS
      system-error-code: SYSTEM_ERROR
      validation-error-code: VALIDATION_ERROR
      unauthorized-error-code: UNAUTHORIZED
      forbidden-error-code: FORBIDDEN
      integration-error-code: INTEGRATION_ERROR
      rate-limit-error-code: RATE_LIMIT_EXCEEDED

  message:
    formatter: message-format
    missing-arg-mode: keep-template
    format-failed-mode: keep-template
  logging:
    enabled: true
    mdc:
      enabled: true
    masking:
      enabled: true
      sensitive-fields:
        - password
        - authorization
        - token
        - access_token
      replacement: "******"
    boundary:
      enabled: true
      http-inbound:
        enabled: true
        completion-enabled: false
      client:
        enabled: true
        feign:
          enabled: true
          completion-enabled: true
        control-plane:
          enabled: true
          completion-enabled: true
        soap:
          enabled: true
          completion-enabled: true
      kafka:
        enabled: false
        producer:
          enabled: true
          requested-enabled: false
          acknowledged-enabled: true
          failed-enabled: true
        consumer:
          enabled: true
          completed-enabled: true
          failed-enabled: true
          retry-enabled: false
          dlt-enabled: false
      security:
        enabled: false
        authentication-failed-enabled: true
        authorization-denied-enabled: true
      elasticsearch:
        enabled: false
        success-enabled: true
        slow-enabled: true
        failure-enabled: true
      solr:
        enabled: false
        success-enabled: true
        slow-enabled: true
        failure-enabled: true
      cache:
        enabled: false
        slow-enabled: true
        failure-enabled: true
      redis:
        enabled: false
        slow-enabled: true
        failure-enabled: true
      scheduler:
        enabled: false
        completion-enabled: false
    request:
      exclude-paths:
        - /actuator/**
        - /swagger-ui/**
        - /v3/api-docs/**
    payload:
      enabled: true
      max-body-size: 102400
      max-field-length: 4096
      inbound:
        enabled: true
        log-request-body: true
        log-response-body: true
        log-headers: false
        allowed-content-types:
          - application/json
          - application/xml
          - application/soap+xml
          - text/plain
          - text/xml
        include-paths: []
        exclude-paths:
          - /actuator/**
          - /swagger-ui/**
          - /v3/api-docs/**
        sampling-rate: 1.0
      outbound:
        enabled: true
        feign:
          enabled: true
        soap:
          enabled: true
        log-request-body: true
        log-response-body: true
        log-headers: false
        allowed-content-types:
          - application/json
          - application/xml
          - application/soap+xml
          - text/plain
          - text/xml
        allowed-target-systems: []
        sampling-rate: 1.0
    execution:
      enabled: false
      default-log-args: false
      default-log-result: false
      slow-threshold-ms: 200
      include-packages:
        - "com.viettel.bccs.price.**.service.*"
        - "com.viettel.bccs.price.**.client.*"
      exclude-packages:
        - "com.viettel.bccs.price.**.mapper.*"
        - "com.viettel.bccs.price.**.shared.*"
        - "com.viettel.bccs.price.**.domain.model.*"
        - "com.viettel.bccs.price.**.api.dto.*"
        - "com.viettel.bccs.price.**.persistence.entity.*"

  observability:
    environment: local
    tracing:
      enabled: ${BCCS_OBSERVABILITY_TRACING_ENABLED:false}

  security:
    enabled: false
    public-paths:
      - /actuator/health/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /v3/api-docs.yaml
      - /swagger-ui.html
      - /swagger-ui/**
      - /error
    service-name: ${spring.application.name}
    control-plane:
      base-url: http://10.207.252.17:8484
      connect-timeout: 3s
      read-timeout: 5s
    snapshot:
      startup-load: true
      fail-fast: true
      poll-interval: 30s
      max-staleness: 5m

    catalog-sync:
      enabled: true
    concurrency:
      enabled: true
      namespace: ${APP_ENV:local}
      lease-ttl: 60s
      renew-interval: 20s
      renewal-threads: 2
      acquire-timeout: 1s
      max-in-flight-acquires: 2

  redis:
    # Set to true to enable BCCS Redis Operations (bccs-starter-redis)
    redisson:
      enabled: ${BCCS_REDIS_REDISSON_ENABLED:true}
      lazy-initialization: true
      retry-attempts: 0
      retry-interval: 1500ms
      single:
        connection-pool-size: 32
        connection-minimum-idle-size: 4
        subscription-connection-pool-size: 8
        subscription-connection-minimum-idle-size: 1
      cluster:
        master-connection-pool-size: 16
        master-connection-minimum-idle-size: 1
        slave-connection-pool-size: 16
        slave-connection-minimum-idle-size: 1
        subscription-connection-pool-size: 8
        subscription-connection-minimum-idle-size: 1
        scan-interval: 1s
    enabled: true
    type: ${BCCS_REDIS_TYPE:cluster}
    key-prefix: ${BCCS_REDIS_KEY_PREFIX:bccs:${spring.application.name}:}
    default-ttl: 10m
    require-ttl: false
    fail-fast: false
    operation-timeout: 1s
    max-in-flight-operations: 32
    log-startup-info: true

  cache:
    enabled: true
    # Supported modes: memory-only, redis-only, two-level.
    # Set BCCS_CACHE_ENABLED=false only after removing sample cache components that inject BccsCacheService.
    # redis-only and two-level require a running Redis instance.
    mode: ${BCCS_CACHE_MODE:memory-only}
    l1:
      default-ttl: 5m
      max-size: 5000
    l2:
      default-ttl: 1h
      cache-null-values: false
    invalidation:
      # Keep invalidation off by default for local runs because it uses Redis Pub/Sub.
      # Enable only when the Redis user has channel subscribe/publish permissions.
      enabled: ${BCCS_CACHE_INVALIDATION_ENABLED:false}
      provider: redis
      topic: ${BCCS_CACHE_INVALIDATION_TOPIC:${spring.application.name}.cache.invalidation}
    caches:
      customerProfile:
        ttl-l1: 30s
        ttl-l2: 5m
      accountProfile:
        ttl-l1: 30s
        ttl-l2: 5m

  kafka:
    # Set to false to completely disable Kafka auto-configuration and listener containers.
    # When false, the application uses a NoOp publisher and ignores KAFKA_BOOTSTRAP_SERVERS.
    enabled: ${BCCS_KAFKA_ENABLED:true}
    consumer:
      group-id: ${BCCS_KAFKA_CONSUMER_GROUP_ID:${spring.application.name}-local}

  data:
    enabled: ${BCCS_DATA_ENABLED:true}
    database-type: ORACLE
    audit:
      enabled: ${BCCS_DATA_AUDIT_ENABLED:false}
    migration:
      enabled: false

  client:
    enabled: true
    # Static client definitions are loaded from YAML and environment variables at startup.
#    clients:
