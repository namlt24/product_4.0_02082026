server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy moi request /api/** sang Control Plane backend (ten service trong docker-compose network).
    #
    # QUAN TRONG: dung "resolver" + bien $backend_upstream (khong ghi thang hostname
    # vao proxy_pass) de nginx RESOLVE LAI DNS dinh ky qua DNS noi bo cua Docker
    # (127.0.0.11), thay vi chi resolve 1 lan luc container khoi dong roi cache
    # vinh vien. Neu khong co "resolver" o day, moi lan container "backend" bi
    # rebuild/restart (doi IP noi bo) se khien nginx tra ve 502 Bad Gateway cho toi
    # khi CHINH container frontend nay duoc restart theo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream backend:8080;
        # Dung $request_uri (URI GOC, chua bi nginx normalize) thay vi de proxy_pass
        # tu ghep - vi khi proxy_pass co bien, nginx KHONG tu dong noi phan duong dan
        # con lai cua request vao URI khai bao trong directive (khac voi proxy_pass
        # tinh khong co bien). Neu quen $request_uri o day, moi request se bi rut gon
        # thanh dung "/api/" (mat toan bo phan sau, vi du "/endpoints"), backend tra ve
        # loi "No static resource api" thay vi that su xu ly request.
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File JS/CSS build ra co hash trong ten (vi du main-ABC123.js) - noi dung khong
    # bao gio doi ma khong doi ten, nen cache dai han/immutable an toan tuyet doi.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: moi route khong khop file tinh deu tra ve index.html de Angular Router xu ly.
    # index.html PHAI luon revalidate (KHONG duoc cache dai han) - no la noi tham chieu
    # toi ten file JS/CSS co hash moi nhat; da tung gap bug "sua code xong, deploy roi,
    # browser van hien giao diign cu" vi thieu dong nay - nginx mac dinh KHONG tu gui
    # Cache-Control cho static file, nhung 1 so trinh duyet/proxy trung gian van co the
    # tu y cache heuristics theo Last-Modified neu khong co chi thi ro rang.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    gzip on;
    gzip_types text/plain application/javascript application/json text/css;
}
