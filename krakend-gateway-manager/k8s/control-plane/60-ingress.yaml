# ============================================================================
# Cum testlab-c2 KHONG co Ingress Controller trong namespace (khong list duoc
# ingressclasses - RBAC han che; cac service BCCS khac deu dung NodePort) ->
# thay 2 Ingress bang 2 Service NodePort theo cach da lam tren cum myviettel
# (DEPLOYMENT_GUIDE.md):
#   - gwm-frontend :80  -> NodePort 8837 (UI quan tri, browser truy cap)
#   - gwm-backend  :8080 -> NodePort 8051 (API cho RemoteConfigSyncService
#     cua cac Data Plane goi ve + truy cap truc tiep khi can)
# NodePort khoang 8000-10000 (gioi han cum), chon gia tri lon de giam kha nang trung port
# dang dung (8051/8837 = 2 nodePort dung tu truoc cho gateway-manager tren cum myviettel, o day thu de tang kha nang tuong thich firewall
# nhung con free trong cum nay da xac nhan qua kubectl get svc toan namespace
# product chi dung 8043-8047).
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: gwm-frontend-nodeport
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane-ui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 8837
---
apiVersion: v1
kind: Service
metadata:
  name: gwm-backend-nodeport
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 8051
