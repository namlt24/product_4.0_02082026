# ===========================================================================
# Gateway Manager - full stack (Dynamic Composite API Orchestrator)
#
# Kien truc: backend GIO CHINH LA gateway thuc thi traffic that (khong con
# container KrakenD/Gravitee rieng nao ca - CompositeOrchestratorEngine doc
# EndpointConfig/BackendStep/FieldMapping/UpstreamService tu Oracle, cache
# trong-process, thuc thi composition truc tiep tai request-time).
#
#   Browser --/api/**--> [frontend :4200] --/api/**--> [backend :8080] --> Redis (cache)
#   App/Client -----------------------------------------> [backend :8080] --> Upstream that
#                                                              |
#                                                          (JDBC)
#                                                              v
#                                          Oracle (KHONG phai container trong file
#                                          nay) - mac dinh dev/demo tro Oracle CHUNG
#                                          voi cac service BCCS qua db-local, nhung
#                                          DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD
#                                          deu doc duoc tu .env - moi doi tu trien
#                                          khai co the tro toi Oracle 19c RIENG cua
#                                          minh ma KHONG can sua file nay (xem
#                                          DEPLOYMENT_GUIDE.md va .env.example)
#
# Chay dev/demo (dung chung ha tang BCCS): docker compose up -d (yeu cau db-local
# da chay truoc - xem ../db-local/README.md). Trien khai rieng cho 1 doi: xem
# DEPLOYMENT_GUIDE.md.
# UI:            http://localhost:4200
# Gateway thuc thi (data plane, App/Client goi vao):  http://localhost:8080
# ===========================================================================

services:

  # Redis RIENG cho gateway nay (khong dung chung bccs-redis cua db-local) -
  # tach biet de cache gateway khong canh tranh tai nguyen voi cache nghiep vu
  # cua cac service khac, dung tinh than "bulkhead" (xem UpstreamHttpExecutor).
  redis:
    image: redis:7-alpine
    container_name: gwm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gwm-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gwm-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Ma dinh danh doi (dung de phan biet instance cua doi nao neu nhieu doi
      # cung feed 1 he thong observability chung - xem SPRING_APPLICATION_NAME/
      # ELASTIC_APM_SERVICE_NAME duoi day). Doi tu chay rieng KHONG bat buoc dat -
      # mac dinh "default" van chay dung, chi kem theo ten instance chung chung.
      TEAM_CODE: ${TEAM_CODE:-default}
      # Mac dinh tro toi Oracle CHUNG voi BCCS qua db-local (container bccs-oracle,
      # port 1521 publish ra host qua host.docker.internal) - DUNG cho dev/demo
      # tren may nay. Moi doi tu trien khai instance RIENG: dat DB_HOST/DB_PORT
      # trong .env tro toi Oracle 19c cua chinh doi (xem DEPLOYMENT_GUIDE.md).
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-1521}
      DB_NAME: ${DB_NAME:-FREEPDB1}
      DB_USER: ${DB_USER:-BCCS_PRODUCT}
      DB_PASSWORD: ${DB_PASSWORD:-BCCS_PRODUCT123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      # API key bao ve Control Plane (/api/**) - xem ApiKeyAuthFilter. BAT BUOC dat
      # qua .env khi chay that (khong dung default "changeme-local-dev" cua app).
      GATEWAY_ADMIN_API_KEY: ${GATEWAY_ADMIN_API_KEY:-changeme-local-dev}
      # Rate limit Data Plane - xem RateLimitFilter/RateLimitService. Gia tri
      # mac dinh (300 req/60s moi IP) hop ly cho dev/demo, chinh qua .env neu can.
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      GATEWAY_RATE_LIMIT_MAX_REQUESTS: ${GATEWAY_RATE_LIMIT_MAX_REQUESTS:-300}
      # Mac dinh tro toi Elasticsearch CHUNG cua BCCS (db-local, port 9200 publish
      # ra host). Moi doi tu trien khai: dat GATEWAY_AUDIT_ES_HOST trong .env tro
      # toi Elasticsearch RIENG cua doi (hoac GATEWAY_AUDIT_ENABLED=false neu
      # doi chua co ES - tinh nang audit fail-open, tat khong anh huong traffic
      # that). Xem AuditLogService/LogSearchService.
      GATEWAY_AUDIT_ENABLED: ${GATEWAY_AUDIT_ENABLED:-true}
      GATEWAY_AUDIT_ES_HOST: ${GATEWAY_AUDIT_ES_HOST:-host.docker.internal}
      GATEWAY_AUDIT_ES_PORT: ${ES_PORT:-9200}
      # Dinh danh instance nay trong log/APM chung (Spring Boot tu doc bien moi
      # truong SPRING_APPLICATION_NAME, uu tien hon literal trong application.yml) -
      # kem TEAM_CODE de phan biet duoc doi nao dang goi khi nhieu doi feed chung
      # 1 he thong log/APM (neu co).
      SPRING_APPLICATION_NAME: krakend-gateway-manager-${TEAM_CODE:-default}
      # Elastic APM Java agent (gan qua -javaagent, xem Dockerfile). Mac dinh tro
      # APM Server CHUNG cua BCCS (db-local, port 8200 publish ra host) - moi doi
      # tu trien khai dat APM_SERVER_HOST/APM_SERVER_PORT trong .env tro APM rieng
      # (hoac bo qua, agent khong ket noi duoc se tu tat, khong chan traffic that).
      ELASTIC_APM_SERVICE_NAME: krakend-gateway-manager-${TEAM_CODE:-default}
      ELASTIC_APM_SERVER_URL: http://${APM_SERVER_HOST:-host.docker.internal}:${APM_SERVER_PORT:-8200}
      ELASTIC_APM_ENVIRONMENT: ${APM_ENVIRONMENT:-local}
      ELASTIC_APM_APPLICATION_PACKAGES: com.bccs.gatewaymanager
    ports:
      - "8080:8080"     # ca control plane (/api/**) lan data plane (traffic that) tren cung port
    networks:
      - gwm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gwm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - gwm-net

networks:
  gwm-net:
    driver: bridge

volumes:
  redisdata:
