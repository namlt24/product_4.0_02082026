server:
  port: 9000

spring:
  application:
    name: krakend-gateway-manager
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:gatewaymanager}
    username: ${DB_USER:gatewaymanager}
    password: ${DB_PASSWORD:gatewaymanager}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # dev/demo: tu dong tao/cap nhat schema. Production nen chuyen sang Flyway/Liquibase.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Cau hinh rieng cua Gateway Manager
gatewaymanager:
  krakend:
    name: krakend-gateway            # ten hien trong "name" cua krakend.json
    port: 8080                       # port KrakenD lang nghe (khop voi docker-compose)
    timeout: 3000ms
    cache-ttl: 300s
    container-name: ${KRAKEND_CONTAINER_NAME:krakend-gateway}   # ten container Docker de restart
    config-path: ${KRAKEND_CONFIG_PATH:/etc/krakend/krakend.json} # duong dan file trong volume dung chung
  docker:
    socket-path: ${DOCKER_SOCKET_PATH:/var/run/docker.sock}
    api-version: ${DOCKER_API_VERSION:v1.43}

logging:
  level:
    com.bccs.gatewaymanager: INFO
    org.hibernate.SQL: WARN
