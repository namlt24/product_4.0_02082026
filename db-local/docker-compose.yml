name: bccs-db-local

services:
  database:
    image: gvenzl/oracle-free:23-slim
    container_name: bccs-oracle
    environment:
      ORACLE_PASSWORD: ${DB_ROOT_PASSWORD:-bccs_root}
      APP_USER: ${DB_USERNAME:-BCCS_PRODUCT}
      APP_USER_PASSWORD: ${DB_PASSWORD:-BCCS_PRODUCT123}
    ports:
      - "${DB_PORT:-1521}:1521"
    volumes:
      - ./oradata:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: bccs-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - bccs_es_local_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Kibana - xem log EFK (index bccs-logs-*) va du lieu nghiep vu tren cung bccs-elasticsearch.
  # Fluent Bit (chay trong K8s, xem k8s/fluent-bit/) day log vao day qua host.docker.internal:9200.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: bccs-kibana
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # APM Server dung chung - nhan trace/transaction tu Elastic APM Java agent gan
  # vao krakend-gateway-manager (va bat ky service BCCS nao khac sau nay muon dung
  # lai) qua -javaagent, day vao CHINH bccs-elasticsearch. --strict.perms=false la
  # co (flag) chuan cua ho Elastic Beats/apm-server khi bind-mount file config tu
  # host (kiem tra permission file nghiem ngat mac dinh se tu choi chay).
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.3
    container_name: bccs-apm-server
    command: ["--strict.perms=false"]
    ports:
      - "${APM_SERVER_PORT:-8200}:8200"
    volumes:
      - ./apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  bccs_es_local_data:
