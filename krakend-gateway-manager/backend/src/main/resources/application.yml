server:
  # File nay CHI gom cau hinh DUNG CHUNG ca 2 profile (control-plane/data-plane,
  # xem SAD-Gateway-Manager.md ADR-07) - PHAI chon 1 trong 2 qua
  # SPRING_PROFILES_ACTIVE khi chay that (xem application-control-plane.yml/
  # application-data-plane.yml cho cau hinh RIENG tung ben, vi du Oracle/JPA
  # CHI o control-plane). KHONG duoc dat spring.datasource/spring.jpa o day -
  # se ap dung ca cho Data Plane neu ai do quen set profile, pha ho ddl-auto=
  # validate bat buoc cua Control Plane (xem git history 2026-09-14: da tung
  # bi hoi nham ve dang truoc-ADR-07 + ddl-auto=update, sua lai o day).
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: krakend-gateway-manager
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents

# Cau hinh rieng cua Gateway Manager
gatewaymanager:
  gateway:
    # Phai khop dung ten service/container that trong docker-compose.yml (service
    # "backend", container_name "gwm-backend") - sai ten se khien DependencyAnalyzer.
    # isSelfHost() khong nhan dien duoc Upstream tu tro vao chinh gateway, bo sot
    # canh bao vong lap phu thuoc that.
    self-host-aliases: localhost,127.0.0.1,backend,gwm-backend
  # Rate limit Data Plane (bao ve Upstream that phia sau) - xem RateLimitFilter/
  # RateLimitService. max-requests la so request toi da MOI client (theo IP) duoc
  # phep trong window-seconds giay; vuot qua se bi tu choi 429 cho toi khi window
  # het han. 300 req/60s (~5 req/s trung binh) la muc mac dinh vua du rong cho
  # test tay/tich hop binh thuong nhung van chan duoc spam/vong lap that su.
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    window-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}
    max-requests: ${GATEWAY_RATE_LIMIT_MAX_REQUESTS:300}
  # Audit log (request/hop) day vao Elasticsearch dung chung cua he thong BCCS
  # (xem db-local/docker-compose.yml - bccs-elasticsearch) - phuc vu trang
  # "Tra cuu Log". host/port ket noi qua host.docker.internal (dung y het cach
  # Oracle da lam) vi khong join chung network voi db-local.
  audit:
    enabled: ${GATEWAY_AUDIT_ENABLED:true}
    elasticsearch:
      host: ${GATEWAY_AUDIT_ES_HOST:localhost}
      port: ${GATEWAY_AUDIT_ES_PORT:9200}
    # So ngay giu lai log (gwm-requests-*/gwm-hops-*) - qua han se bi XOA CA
    # INDEX tu dong (xem AuditLogRetentionService), khong phai xoa tung
    # document. Dat <=0 de tat han (giu vinh vien, tu quan ly bang tay).
    retention-days: ${GATEWAY_AUDIT_RETENTION_DAYS:3}
  # Connection pool HTTP toi Upstream (Apache HttpClient 5, xem
  # UpstreamHttpExecutor.restTemplateFor()) - thay SimpleClientHttpRequestFactory
  # mac dinh (moi request 1 ket noi moi, can port ephemeral o tai cao). So ket
  # noi thuc te = so request DONG THOI (Little's Law), KHONG phai rps - nen chi
  # thay doi khi scale so request dong thoi (vi du 2000 RPS voi mean 1.5s =
  # 3000 in-flight tong cong -> tang max-total/max-per-route len theo).
  upstream-http:
    pool-max-total: ${GATEWAY_HTTP_POOL_MAX_TOTAL:600}
    pool-max-per-route: ${GATEWAY_HTTP_POOL_MAX_PER_ROUTE:550}
    # So phut 1 to hop (upstream, connectMs, readMs) khong duoc dung toi truoc khi
    # tu dong dong pool+thread cua no (xem UpstreamHttpExecutor.sweepIdleClients()) -
    # CHAN ro ri thread khi "Thu nhanh" thu nhieu gia tri timeout khac nhau ma
    # khong bao gio invalidate() (chi doi ten/xoa Upstream moi goi ham do).
    idle-eviction-minutes: ${GATEWAY_HTTP_POOL_IDLE_EVICTION_MINUTES:15}

# Resilience4j: dependency moi, dang ky dong theo TEN Upstream Service tai
# runtime (xem UpstreamHttpExecutor) - cac gia tri default duoi day ap dung
# khi mot Upstream chua co entry rieng.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 500ms
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms

logging:
  level:
    com.bccs.gatewaymanager: INFO
    org.hibernate.SQL: WARN
