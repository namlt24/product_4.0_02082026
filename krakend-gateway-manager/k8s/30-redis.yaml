# ============================================================================
# Redis rieng cho instance Gateway Manager cua doi nay - CHI dung cho
# cache-aside (per-step/response toan bo) + bo dem rate-limit, ca 2 deu
# fail-open (mat du lieu Redis KHONG lam gian doan traffic that - xem
# GatewayCacheService/RateLimitService) - vi vay KHONG can PersistentVolume,
# 1 Deployment thuong (khong phai StatefulSet) la du.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gwm-redis
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-manager
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-manager
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gwm-redis
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: 6379
