# ============================================================================
# Backend = Control Plane (/api/**, cau hinh) + Data Plane (traffic that qua
# CompositeOrchestratorEngine) trong CUNG 1 process, cung 1 port 8080 (xem
# docker-compose.yml). Doc TOAN BO cau hinh khong-mat tu ConfigMap "gwm-config"
# va mat khau/khoa tu Secret "gwm-secret" (xem 00-configmap.yaml,
# 01-secret.yaml.example) - KHONG hardcode gia tri nao o day.
#
# SUA "image:" ben duoi thanh dung registry/tag noi bo cua doi truoc khi apply
# (xem DEPLOYMENT_GUIDE.md).
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gwm-backend
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-manager
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-manager
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: registry.noi-bo-cua-doi.local/krakend-gateway-manager-backend:v1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gwm-config
            - secretRef:
                name: gwm-secret
          env:
            - name: SERVER_PORT
              value: "8080"
            # Bien hop nhat tu TEAM_CODE (ConfigMap) - Spring Boot khong tu ghep
            # chuoi tu 2 nguon nen phai khai bao rieng o day, dung cu phap
            # $(VAR) de k8s noi TEAM_CODE da co san tu envFrom o tren.
            - name: SPRING_APPLICATION_NAME
              value: "krakend-gateway-manager-$(TEAM_CODE)"
            - name: ELASTIC_APM_SERVICE_NAME
              value: "krakend-gateway-manager-$(TEAM_CODE)"
            - name: ELASTIC_APM_SERVER_URL
              value: "http://$(APM_SERVER_HOST):$(APM_SERVER_PORT)"
            - name: ELASTIC_APM_ENVIRONMENT
              value: "$(APM_ENVIRONMENT)"
            - name: ELASTIC_APM_APPLICATION_PACKAGES
              value: "com.bccs.gatewaymanager"
            - name: GATEWAY_AUDIT_ES_PORT
              value: "$(ES_PORT)"
          # Readiness dung "/actuator/health" (endpoint TONG HOP mac dinh, gom ca
          # DataSource health indicator cua Oracle) vi Oracle la phu thuoc BAT
          # BUOC (fail-closed dung cho DB, khac voi Redis/ES la fail-open) - khi
          # Oracle gian doan, Pod bi rut khoi Service "gwm-backend" (khong nhan
          # traffic moi) nhung KHONG bi restart (Spring Boot tu dong bat 2 health
          # group "liveness"/"readiness" khi phat hien dang chay trong
          # Kubernetes qua bien KUBERNETES_SERVICE_HOST - xem application.yml).
          # Liveness dung rieng group "/actuator/health/liveness" (chi phan anh
          # LivenessState noi bo cua JVM, KHONG gom DB) vi restart Pod khong giai
          # quyet duoc 1 loi ha tang Oracle o ben ngoai Pod.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gwm-backend
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: backend
  ports:
    - port: 8080
      targetPort: 8080
