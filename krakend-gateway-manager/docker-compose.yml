version: "3.9"

# ===========================================================================
# KrakenD Gateway Manager - full stack
#
# Kien truc:
#   Browser --> [frontend: Angular/Nginx :4200] --/api/**--> [backend: Spring Boot :9000]
#                                                                 |            |
#                                                        (JDBC)   |            | (Docker Engine API
#                                                                 v            |  qua /var/run/docker.sock:
#                                                          [postgres :5432]    |  POST /containers/{name}/restart)
#                                                                              v
#                                                        (ghi file, atomic)  [krakend :8080]
#                                                        /etc/krakend/krakend.json
#                                                        (volume dung chung: krakend-config)
#
# Chay: docker compose up -d
# UI:   http://localhost:4200
# API Gateway (KrakenD): http://localhost:8080
# ===========================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: gwm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gatewaymanager}
      POSTGRES_USER: ${DB_USER:-gatewaymanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gatewaymanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"     # expose ra host de debug bang client ngoai, khong bat buoc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gatewaymanager} -d ${DB_NAME:-gatewaymanager}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gwm-net

  # Init container: chi copy krakend.json mau vao volume dung chung NEU volume
  # con trong (lan dau chay). Sau do backend se ghi de moi khi nguoi dung bam Deploy.
  krakend-init:
    image: alpine:3.20
    container_name: gwm-krakend-init
    volumes:
      - ./gateway/krakend.json:/seed/krakend.json:ro
      - krakend-config:/etc/krakend
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -f /etc/krakend/krakend.json ]; then
          echo "[krakend-init] Seed krakend.json lan dau...";
          cp /seed/krakend.json /etc/krakend/krakend.json;
        else
          echo "[krakend-init] krakend.json da ton tai, giu nguyen.";
        fi
    networks:
      - gwm-net

  krakend:
    image: devopsfaith/krakend:2.6
    container_name: krakend-gateway     # PHAI khop voi gatewaymanager.krakend.container-name ben backend
    restart: unless-stopped
    depends_on:
      krakend-init:
        condition: service_completed_successfully
    volumes:
      - krakend-config:/etc/krakend
    ports:
      - "8080:8080"
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    networks:
      - gwm-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gwm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      krakend:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gatewaymanager}
      DB_USER: ${DB_USER:-gatewaymanager}
      DB_PASSWORD: ${DB_PASSWORD:-gatewaymanager}
      KRAKEND_CONTAINER_NAME: krakend-gateway
      KRAKEND_CONFIG_PATH: /etc/krakend/krakend.json
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    volumes:
      - krakend-config:/etc/krakend                    # cung volume voi krakend -> ghi file cau hinh
      - /var/run/docker.sock:/var/run/docker.sock       # cho phep goi Docker Engine API de restart krakend
    ports:
      - "9000:9000"
    networks:
      - gwm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gwm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - gwm-net

networks:
  gwm-net:
    driver: bridge

volumes:
  pgdata:
  krakend-config:
