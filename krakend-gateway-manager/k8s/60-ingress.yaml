# ============================================================================
# NGINX Ingress Controller - 2 host RIENG BIET cho 2 kieu traffic khac nhau
# (xem so do trong docker-compose.yml):
#
#   1) UI quan tri (Control Plane, nguoi dung vao cau hinh endpoint/upstream)
#      -> tro toi frontend, CHINH frontend se tu proxy "/api/**" sang backend
#      (xem frontend/nginx.conf.template) - browser KHONG bao gio goi thang
#      backend cho phan quan tri.
#   2) Data Plane (App/Client noi bo goi thang endpoint composite that su,
#      /GATEWAY_ADMIN_API_KEY hoac public tuy endpoint) -> tro THANG toi
#      backend, KHONG di qua frontend (frontend chi phuc vu UI tinh, khong
#      lien quan gi toi traffic nghiep vu that).
#
# SUA 2 "host:" ben duoi thanh dung domain noi bo cua doi (tro DNS ve dia chi
# cua NGINX Ingress Controller) truoc khi apply - xem DEPLOYMENT_GUIDE.md.
# Vi du nay dung HTTP thuan; neu doi co TLS noi bo, them "tls:" + Secret chua
# certificate va annotation tuong ung cua NGINX Ingress Controller dang dung.
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gwm-ingress
  labels:
    app.kubernetes.io/name: gateway-manager
  annotations:
    # Endpoint composite co the tra ve payload gop tu nhieu step backend, doi
    # gioi han mac dinh 1m cua NGINX Ingress neu can cho response lon.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: gwm-ui.doi-cua-ban.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gwm-frontend
                port:
                  number: 80
    - host: gwm-api.doi-cua-ban.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gwm-backend
                port:
                  number: 8080
