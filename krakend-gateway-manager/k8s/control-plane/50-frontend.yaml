# ============================================================================
# Frontend Angular tinh, phuc vu boi Nginx, tu proxy "/api/**" sang Service
# "gwm-backend" trong CUNG namespace (xem frontend/nginx.conf.template) -
# khong doc ConfigMap/Secret nao ca, khong co bien moi truong rieng. CHI ton
# tai o Control Plane (1 ban duy nhat) - Data Plane KHONG co frontend, doi
# nao dung dich vu chi can trien khai backend + Redis (xem ../data-plane/).
#
# SUA "image:" ben duoi thanh dung registry/tag noi bo truoc khi apply.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gwm-frontend
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-manager
      app.kubernetes.io/component: control-plane-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-manager
        app.kubernetes.io/component: control-plane-ui
    spec:
      containers:
        - name: frontend
          image: registry.noi-bo-cua-doi.local/krakend-gateway-manager-frontend:v2.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gwm-frontend
  labels:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane-ui
spec:
  selector:
    app.kubernetes.io/name: gateway-manager
    app.kubernetes.io/component: control-plane-ui
  ports:
    - port: 80
      targetPort: 80
